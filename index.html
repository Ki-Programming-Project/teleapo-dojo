<!DOCTYPE html>
<!-- v1.0.0 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>テレアポ道場</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    background: #1a1a2e;
    color: #eee;
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 0);
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  /* ===== TITLE SCREEN ===== */
  #screen-title {
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
  }
  .title-logo {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    line-height: 1.4;
    color: #f0c040;
    text-shadow: 0 0 20px rgba(240,192,64,0.4);
  }
  .title-logo span { font-size: 14px; color: #aaa; display: block; margin-top: 4px; }
  .title-desc {
    font-size: 14px;
    color: #aaa;
    text-align: center;
    line-height: 1.6;
  }

  /* ===== GAME SCREEN ===== */
  #screen-game {
    padding: 8px 12px;
    gap: 8px;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    gap: 8px;
    flex-shrink: 0;
  }
  .stat-box {
    flex: 1;
    background: #16213e;
    border-radius: 10px;
    padding: 8px 6px;
    text-align: center;
    border: 1px solid #0f3460;
  }
  .stat-label { font-size: 10px; color: #888; letter-spacing: 0.5px; }
  .stat-value { font-size: 22px; font-weight: bold; line-height: 1.2; }
  .stat-value.score { color: #f0c040; }
  .stat-value.trust { color: #4ecca3; }
  .stat-value.time  { color: #e94560; }
  .stat-value.combo { color: #a78bfa; }

  /* Case card */
  .case-card {
    flex: 1;
    background: #16213e;
    border-radius: 14px;
    border: 1px solid #0f3460;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
    position: relative;
  }
  .case-tag {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: bold;
    align-self: flex-start;
  }
  .tag-easy   { background: #1a3a2a; color: #4ecca3; border: 1px solid #4ecca3; }
  .tag-medium { background: #3a2a1a; color: #f0a040; border: 1px solid #f0a040; }
  .tag-hard   { background: #3a1a1a; color: #e94560; border: 1px solid #e94560; }

  .case-company { font-size: 13px; color: #888; }
  .case-situation {
    font-size: 16px;
    line-height: 1.6;
    color: #eee;
    flex: 1;
  }
  .case-hint { font-size: 12px; color: #6688aa; font-style: italic; }

  /* Feedback overlay */
  .feedback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  .feedback.show { opacity: 1; }
  .feedback.success { background: rgba(78,204,163,0.25); color: #4ecca3; }
  .feedback.fail    { background: rgba(233,69,96,0.25);  color: #e94560; }

  /* Choices */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .choice-btn {
    width: 100%;
    min-height: 52px;
    padding: 10px 14px;
    border: 1px solid #0f3460;
    border-radius: 10px;
    background: #16213e;
    color: #eee;
    font-size: 14px;
    line-height: 1.4;
    text-align: left;
    cursor: pointer;
    transition: transform 0.1s, background 0.1s;
    touch-action: manipulation;
  }
  .choice-btn:active:not(:disabled) { transform: scale(0.98); background: #1e2d50; }
  .choice-btn:disabled { opacity: 0.5; cursor: default; }
  .choice-btn.correct { background: #1a3a2a; border-color: #4ecca3; color: #4ecca3; }
  .choice-btn.wrong   { background: #3a1a1a; border-color: #e94560; color: #e94560; }

  /* ===== GAMEOVER SCREEN ===== */
  #screen-gameover {
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 24px;
  }
  .over-title { font-size: 24px; font-weight: bold; color: #e94560; }
  .over-rank {
    font-size: 48px;
    font-weight: bold;
    color: #f0c040;
    text-shadow: 0 0 24px rgba(240,192,64,0.5);
  }
  .over-stats {
    background: #16213e;
    border-radius: 14px;
    padding: 16px 24px;
    width: 100%;
    border: 1px solid #0f3460;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .over-stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 15px;
  }
  .over-stat-row span:last-child { font-weight: bold; color: #f0c040; }

  /* ===== BUTTONS ===== */
  .btn-primary {
    width: 100%;
    max-width: 300px;
    height: 52px;
    background: linear-gradient(135deg, #f0c040, #e07020);
    color: #1a1a2e;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 26px;
    cursor: pointer;
    touch-action: manipulation;
    transition: opacity 0.1s, transform 0.1s;
  }
  .btn-primary:active { opacity: 0.85; transform: scale(0.97); }

  /* Timer bar */
  .timer-bar-wrap {
    height: 4px;
    background: #0f3460;
    border-radius: 2px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .timer-bar {
    height: 100%;
    background: #e94560;
    border-radius: 2px;
    transition: width 0.9s linear;
  }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <div id="screen-title" class="screen active">
    <div class="title-logo">📞 テレアポ道場<span>～架電の達人を目指せ～</span></div>
    <div class="title-desc">
      次々と来る案件に対応し<br>
      信頼度を保ちながらスコアを稼ごう！<br><br>
      時間切れ・信頼度0でゲームオーバー
    </div>
    <button class="btn-primary" id="btn-start">スタート</button>
    <div id="version-display" style="font-size:11px;color:#444;position:absolute;bottom:max(env(safe-area-inset-bottom,8px),8px);right:12px;"></div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="status-bar">
      <div class="stat-box">
        <div class="stat-label">SCORE</div>
        <div class="stat-value score" id="val-score">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">信頼度</div>
        <div class="stat-value trust" id="val-trust">10</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">TIME</div>
        <div class="stat-value time" id="val-time">60</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">COMBO</div>
        <div class="stat-value combo" id="val-combo">0</div>
      </div>
    </div>

    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <div class="case-card" id="case-card">
      <span class="case-tag" id="case-tag"></span>
      <div class="case-company" id="case-company"></div>
      <div class="case-situation" id="case-situation"></div>
      <div class="case-hint" id="case-hint"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="choices" id="choices">
      <button class="choice-btn" id="btn-c0"></button>
      <button class="choice-btn" id="btn-c1"></button>
      <button class="choice-btn" id="btn-c2"></button>
    </div>
  </div>

  <!-- GAMEOVER -->
  <div id="screen-gameover" class="screen">
    <div class="over-title">🚫 ゲームオーバー</div>
    <div class="over-rank" id="over-rank"></div>
    <div class="over-stats">
      <div class="over-stat-row"><span>最終スコア</span><span id="res-score"></span></div>
      <div class="over-stat-row"><span>最大コンボ</span><span id="res-combo"></span></div>
      <div class="over-stat-row"><span>残り信頼度</span><span id="res-trust"></span></div>
    </div>
    <button class="btn-primary" id="btn-restart">もう一度プレイ</button>
  </div>

</div>

<script>
(function() {
'use strict';

const VERSION = 'v1.0.0';

/* ===================================================
   CASE DATA
=================================================== */
const CASES = [
  {
    tag: 'easy', company: '田中商事（中小企業）',
    situation: '「今忙しいから」と言われた。どう返す？',
    hint: '相手の時間を尊重しつつ継続を狙う',
    choices: [
      { text: '「承知しました。いつ頃お時間よろしいでしょうか？」', correct: true },
      { text: '「少しだけ！本当に5分で済みます！」と食い下がる', correct: false },
      { text: '「そうですか、失礼しました」と即切り', correct: false },
    ]
  },
  {
    tag: 'easy', company: '山本工業（製造業）',
    situation: '「担当者に代わります」と言われた。',
    hint: '担当者への引き継ぎを最大限活かす',
    choices: [
      { text: '「ありがとうございます。よろしくお願いします」と丁寧に待つ', correct: true },
      { text: '「いえ、あなたでも大丈夫です！」と断る', correct: false },
      { text: '担当者に繋がる前に用件をまくし立てる', correct: false },
    ]
  },
  {
    tag: 'medium', company: '鈴木物流（運送業）',
    situation: '「うちには必要ない」と言われた。',
    hint: 'ニーズを引き出すヒアリングが鍵',
    choices: [
      { text: '「具体的にどのような点でご不要とお感じでしょうか？」', correct: true },
      { text: '「絶対必要になりますよ！」と押す', correct: false },
      { text: '「わかりました。ありがとうございました」と終わる', correct: false },
    ]
  },
  {
    tag: 'medium', company: '佐藤商店（小売業）',
    situation: '「他社と契約している」と言われた。',
    hint: '競合優位性を上手く伝える',
    choices: [
      { text: '「それは存じませんでした。弊社との違いをご説明してもよいですか？」', correct: true },
      { text: '「そちらは高いですよね」と競合を貶める', correct: false },
      { text: '「じゃあ結構です」とすぐ引く', correct: false },
    ]
  },
  {
    tag: 'hard', company: 'A商社（大手）',
    situation: '担当者が不在。折り返し連絡を取り付けたい。',
    hint: '次のアクションを確実に設定する',
    choices: [
      { text: '「○時頃に再度ご連絡してもよろしいでしょうか？」', correct: true },
      { text: '「では伝言をお願いします」だけで終わる', correct: false },
      { text: '「何時に戻りますか？」と詰め気味に聞く', correct: false },
    ]
  },
  {
    tag: 'easy', company: '渡辺歯科（医療）',
    situation: '電話に出てくれた。最初の挨拶をどうする？',
    hint: '第一印象が全て',
    choices: [
      { text: '「〇〇社の△△と申します。今よろしいでしょうか？」', correct: true },
      { text: '「こんにちは！いいお天気ですね〜」と雑談から入る', correct: false },
      { text: '「商品をご紹介したいのですが…」といきなり本題', correct: false },
    ]
  },
  {
    tag: 'medium', company: '高橋IT（IT企業）',
    situation: '「資料を送ってください」と言われた。',
    hint: '資料送付で終わらせない',
    choices: [
      { text: '「ありがとうございます。送付後にご確認のお時間をいただけますか？」', correct: true },
      { text: '「わかりました」とすぐ電話を切る', correct: false },
      { text: '「資料より直接ご説明の方が早いです！」と無視する', correct: false },
    ]
  },
  {
    tag: 'hard', company: '中村建設（建設業）',
    situation: '価格が高いと言われた。値引きを迫られている。',
    hint: '価値で説明し、安易な値引きは避ける',
    choices: [
      { text: '「価格に見合う価値についてご説明させてください」', correct: true },
      { text: '「では少しお値引きします！」とすぐ折れる', correct: false },
      { text: '「うちの価格は適正です」と突っぱねる', correct: false },
    ]
  },
  {
    tag: 'hard', company: '松本食品（食品卸）',
    situation: '「検討します」と言われた。いつまでも待てない。',
    hint: '期限を設けてネクストアクションを確保',
    choices: [
      { text: '「ありがとうございます。来週再度ご連絡してもよいですか？」', correct: true },
      { text: '「今すぐお決めいただけますか？」と急かす', correct: false },
      { text: '「わかりました、ではいつでもご連絡ください」と丸投げ', correct: false },
    ]
  },
  {
    tag: 'medium', company: '木村薬局（薬局）',
    situation: '「前に断ったはず」と不機嫌な口調で言われた。',
    hint: '誠実な謝罪で信頼を取り戻す',
    choices: [
      { text: '「ご不快をおかけして申し訳ございません。一点だけよろしいでしょうか？」', correct: true },
      { text: '「そんなはずはないです、私は初めてお電話しています」と反論', correct: false },
      { text: '「失礼しました」と即電話を切る', correct: false },
    ]
  },
];

/* ===================================================
   RANK
=================================================== */
function getRank(score) {
  if (score >= 300) return '🏆 伝説の架電師';
  if (score >= 200) return '🥇 エース営業';
  if (score >= 120) return '🥈 一人前の営業';
  if (score >= 60)  return '🥉 見習い営業';
  return '📋 研修中';
}

/* ===================================================
   STATE
=================================================== */
const INITIAL_STATE = {
  score: 0,
  trust: 10,
  time: 60,
  combo: 0,
  maxCombo: 0,
  phase: 'title',   // title | playing | over
  locked: false,
  caseIndex: -1,
  prevCaseIndex: -1,
};

let state = Object.assign({}, INITIAL_STATE);
let timerId = null;

/* ===================================================
   DOM REFS
=================================================== */
const screens   = { title: document.getElementById('screen-title'), game: document.getElementById('screen-game'), gameover: document.getElementById('screen-gameover') };
const elScore   = document.getElementById('val-score');
const elTrust   = document.getElementById('val-trust');
const elTime    = document.getElementById('val-time');
const elCombo   = document.getElementById('val-combo');
const elTimerBar= document.getElementById('timer-bar');
const elTag     = document.getElementById('case-tag');
const elCompany = document.getElementById('case-company');
const elSit     = document.getElementById('case-situation');
const elHint    = document.getElementById('case-hint');
const elFeedback= document.getElementById('feedback');
const elChoices = [document.getElementById('btn-c0'), document.getElementById('btn-c1'), document.getElementById('btn-c2')];
const elResScore= document.getElementById('res-score');
const elResCombo= document.getElementById('res-combo');
const elResTrust= document.getElementById('res-trust');
const elRank    = document.getElementById('over-rank');

/* ===================================================
   SCREEN
=================================================== */
function showScreen(name) {
  Object.keys(screens).forEach(k => {
    screens[k].classList.toggle('active', k === name);
  });
}

/* ===================================================
   UI UPDATE
=================================================== */
function updateStatusUI() {
  elScore.textContent = state.score;
  elTrust.textContent = Math.max(0, state.trust);
  elTime.textContent  = Math.max(0, state.time);
  elCombo.textContent = state.combo;
  const pct = (state.time / 60) * 100;
  elTimerBar.style.width = pct + '%';
}

function renderCase(c) {
  elTag.textContent     = c.tag === 'easy' ? '易しい' : c.tag === 'medium' ? '普通' : '難しい';
  elTag.className       = 'case-tag tag-' + c.tag;
  elCompany.textContent = c.company;
  elSit.textContent     = c.situation;
  elHint.textContent    = 'ヒント：' + c.hint;

  // shuffle choices
  const shuffled = shuffleArray([...c.choices]);
  elChoices.forEach((btn, i) => {
    btn.textContent = shuffled[i].text;
    btn.dataset.correct = shuffled[i].correct ? '1' : '0';
    btn.className = 'choice-btn';
    btn.disabled = false;
  });

  elFeedback.className = 'feedback';
  elFeedback.textContent = '';
}

/* ===================================================
   CASE SELECTION
=================================================== */
function pickCase() {
  let idx;
  let tries = 0;
  do {
    idx = Math.floor(Math.random() * CASES.length);
    tries++;
  } while (idx === state.prevCaseIndex && tries < 10);
  state.prevCaseIndex = state.caseIndex;
  state.caseIndex = idx;
  return CASES[idx];
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ===================================================
   TIMER
=================================================== */
function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    if (state.phase !== 'playing') return;
    state.time -= 1;
    updateStatusUI();
    if (state.time <= 0) {
      state.time = 0;
      updateStatusUI();
      triggerGameOver();
    }
  }, 1000);
}

function stopTimer() {
  if (timerId !== null) {
    clearInterval(timerId);
    timerId = null;
  }
}

/* ===================================================
   GAME OVER
=================================================== */
function triggerGameOver() {
  if (state.phase === 'over') return;
  state.phase = 'over';
  stopTimer();

  elResScore.textContent = state.score + ' pt';
  elResCombo.textContent = state.maxCombo + ' 連続';
  elResTrust.textContent = Math.max(0, state.trust);
  elRank.textContent     = getRank(state.score);

  showScreen('gameover');
}

/* ===================================================
   CHOICE HANDLER
=================================================== */
function onChoiceClick(btn) {
  if (state.phase !== 'playing') return;
  if (state.locked) return;
  state.locked = true;

  // disable all buttons
  elChoices.forEach(b => { b.disabled = true; });

  const isCorrect = btn.dataset.correct === '1';

  if (isCorrect) {
    const bonus = Math.floor(state.combo / 3);
    state.score += 10 + bonus * 5;
    state.trust  = Math.min(10, state.trust + 1);
    state.combo += 1;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    btn.classList.add('correct');
    showFeedback(true);
  } else {
    state.score  = Math.max(0, state.score - 5);
    state.trust -= 2;
    state.combo  = 0;
    btn.classList.add('wrong');
    // show correct
    elChoices.forEach(b => { if (b.dataset.correct === '1') b.classList.add('correct'); });
    showFeedback(false);
  }

  updateStatusUI();

  // check game over by trust
  if (state.trust <= 0) {
    setTimeout(() => { triggerGameOver(); }, 700);
    return;
  }

  // next case
  setTimeout(() => {
    if (state.phase !== 'playing') return;
    state.locked = false;
    renderCase(pickCase());
  }, 900);
}

function showFeedback(success) {
  elFeedback.textContent = success ? '✅ 成功！' : '❌ 失敗…';
  elFeedback.className   = 'feedback show ' + (success ? 'success' : 'fail');
}

/* ===================================================
   START / RESTART
=================================================== */
function startGame() {
  stopTimer();

  state = {
    score: 0,
    trust: 10,
    time: 60,
    combo: 0,
    maxCombo: 0,
    phase: 'playing',
    locked: false,
    caseIndex: -1,
    prevCaseIndex: -1,
  };

  updateStatusUI();
  elTimerBar.style.transition = 'none';
  elTimerBar.style.width = '100%';
  // re-enable transition after forced reflow
  elTimerBar.getBoundingClientRect();
  elTimerBar.style.transition = 'width 0.9s linear';

  renderCase(pickCase());
  showScreen('game');
  startTimer();
}

/* ===================================================
   EVENT LISTENERS
=================================================== */
document.getElementById('version-display').textContent = VERSION;

document.getElementById('btn-start').addEventListener('pointerup', (e) => {
  e.preventDefault();
  startGame();
});

document.getElementById('btn-restart').addEventListener('pointerup', (e) => {
  e.preventDefault();
  startGame();
});

elChoices.forEach(btn => {
  btn.addEventListener('pointerup', (e) => {
    e.preventDefault();
    onChoiceClick(btn);
  });
});

})();
</script>
</body>
</html>
