<!DOCTYPE html>
<!-- v1.8.0 -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>テレアポ道場</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    background: #1a1a2e;
    color: #eee;
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  #app {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
    max-width: 480px;
    margin: 0 auto;
    padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 0) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 0);
  }

  /* ===== SCREENS ===== */
  .screen { display: none; flex-direction: column; height: 100%; }
  .screen.active { display: flex; }

  /* ===== TITLE SCREEN ===== */
  #screen-title {
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
  }
  .title-logo {
    font-size: 28px;
    font-weight: bold;
    text-align: center;
    line-height: 1.4;
    color: #f0c040;
    text-shadow: 0 0 20px rgba(240,192,64,0.4);
  }
  .title-logo span { font-size: 14px; color: #aaa; display: block; margin-top: 4px; }
  .title-desc {
    font-size: 14px;
    color: #aaa;
    text-align: center;
    line-height: 1.6;
  }

  /* ===== GAME SCREEN ===== */
  #screen-game {
    padding: 8px 12px;
    gap: 8px;
    position: relative;
  }

  /* Status bar */
  .status-bar {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .stat-box {
    flex: 1;
    background: #16213e;
    border-radius: 10px;
    padding: 7px 4px 6px;
    text-align: center;
    border: 1px solid #0f3460;
    transition: transform 0.15s;
  }
  /* スコア・コンボのボックスを強調 */
  .stat-box:first-child  { border-color: rgba(240,192,64,0.35); }
  .stat-box:last-child   { border-color: rgba(167,139,250,0.35); }
  .stat-label { font-size: 9px; color: #777; letter-spacing: 0.8px; text-transform: uppercase; }
  .stat-value { font-size: 22px; font-weight: bold; line-height: 1.15; }
  /* スコアとコンボは1段大きく */
  .stat-box:first-child .stat-value,
  .stat-box:last-child  .stat-value { font-size: 26px; }
  .stat-value.score { color: #f0c040; }
  .stat-value.trust { color: #4ecca3; }
  .stat-value.time  { color: #e94560; }
  .stat-value.combo { color: #a78bfa; }
  /* スコア更新アニメーション用 */
  @keyframes stat-pop {
    0%   { transform: scale(1); }
    40%  { transform: scale(1.18); }
    100% { transform: scale(1); }
  }
  .stat-pop { animation: stat-pop 0.25s ease-out; }

  /* Case card */
  .case-card {
    flex: 1;
    background: #16213e;
    border-radius: 14px;
    border: 1px solid #1a2a50;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    overflow: hidden;
    position: relative;
  }
  .case-tag {
    display: inline-block;
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: bold;
    align-self: flex-start;
    letter-spacing: 0.5px;
  }
  .tag-easy   { background: #1a3a2a; color: #4ecca3; border: 1px solid #4ecca3; }
  .tag-medium { background: #3a2a1a; color: #f0a040; border: 1px solid #f0a040; }
  .tag-hard   { background: #3a1a1a; color: #e94560; border: 1px solid #e94560; }

  .case-company { font-size: 12px; color: #6688aa; letter-spacing: 0.3px; }
  .case-situation {
    font-size: 17px;
    line-height: 1.65;
    color: #f0f0f0;
    flex: 1;
    font-weight: 500;
  }
  .case-hint { font-size: 12px; color: #5577aa; font-style: italic; }

  /* Feedback overlay */
  .feedback {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 14px;
    opacity: 0;
    pointer-events: none;
    font-size: 34px;
    font-weight: bold;
    letter-spacing: 2px;
  }
  /* 成功：フェードイン＋拡大 */
  @keyframes fb-success {
    0%   { opacity: 0; transform: scale(0.7); }
    50%  { opacity: 1; transform: scale(1.08); }
    80%  { opacity: 1; transform: scale(1); }
    100% { opacity: 1; transform: scale(1); }
  }
  /* 失敗：フェードイン＋シェイク */
  @keyframes fb-fail {
    0%   { opacity: 0; transform: translateX(0); }
    15%  { opacity: 1; transform: translateX(-8px); }
    35%  { transform: translateX(8px); }
    55%  { transform: translateX(-6px); }
    75%  { transform: translateX(4px); }
    100% { opacity: 1; transform: translateX(0); }
  }
  .feedback.show.success {
    opacity: 1;
    background: rgba(78,204,163,0.22);
    color: #4ecca3;
    animation: fb-success 0.35s ease-out forwards;
  }
  .feedback.show.fail {
    opacity: 1;
    background: rgba(233,69,96,0.22);
    color: #e94560;
    animation: fb-fail 0.4s ease-out forwards;
  }

  /* Choices */
  .choices {
    display: flex;
    flex-direction: column;
    gap: 7px;
    flex-shrink: 0;
  }
  .choice-btn {
    width: 100%;
    min-height: 54px;
    padding: 11px 16px;
    border: 1px solid #1e3060;
    border-radius: 12px;
    background: #16213e;
    color: #d8e0f0;
    font-size: 14px;
    line-height: 1.45;
    text-align: left;
    cursor: pointer;
    touch-action: manipulation;
    /* 押下感：影あり、scale + opacity */
    box-shadow: 0 2px 0 #0a1628, inset 0 1px 0 rgba(255,255,255,0.05);
    transition: transform 0.08s, opacity 0.08s, box-shadow 0.08s;
    will-change: transform;
  }
  .choice-btn:active:not(:disabled) {
    transform: translateY(2px) scale(0.985);
    box-shadow: none;
    opacity: 0.9;
  }
  .choice-btn:disabled { opacity: 0.45; cursor: default; box-shadow: none; }
  .choice-btn.correct {
    background: #162e20;
    border-color: #4ecca3;
    color: #4ecca3;
    box-shadow: 0 0 0 1px rgba(78,204,163,0.3);
  }
  .choice-btn.wrong {
    background: #2e1616;
    border-color: #e94560;
    color: #e94560;
    box-shadow: 0 0 0 1px rgba(233,69,96,0.3);
  }

  /* ===== GAMEOVER SCREEN ===== */
  #screen-gameover {
    align-items: center;
    justify-content: flex-start;
    gap: 10px;
    padding: 16px 20px env(safe-area-inset-bottom, 16px);
    overflow: hidden;
  }
  .over-title { font-size: 18px; font-weight: bold; color: #e94560; margin-top: 6px; }
  .over-rank {
    font-size: 36px;
    font-weight: bold;
    color: #f0c040;
    text-shadow: 0 0 18px rgba(240,192,64,0.5);
    line-height: 1.1;
  }
  /* ミス理由バッジ */
  #over-reason {
    font-size: 12px;
    padding: 3px 12px;
    border-radius: 20px;
    background: #2e1a1a;
    color: #e94560;
    border: 1px solid #e94560;
    font-weight: bold;
  }
  /* あと○点誘導 */
  #over-nudge {
    font-size: 14px;
    color: #f0c040;
    font-weight: bold;
    text-align: center;
    min-height: 18px;
  }
  .over-stats {
    background: #16213e;
    border-radius: 12px;
    padding: 10px 18px;
    width: 100%;
    border: 1px solid #0f3460;
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .over-stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 14px;
  }
  .over-stat-row span:last-child { font-weight: bold; color: #f0c040; }
  /* ラスト1回誘導 */
  #over-hook {
    font-size: 13px;
    color: #a78bfa;
    text-align: center;
    min-height: 16px;
    font-style: italic;
  }

  /* ===== BUTTONS ===== */
  .btn-primary {
    width: 100%;
    max-width: 300px;
    height: 52px;
    background: linear-gradient(160deg, #f5cc50, #e07020);
    color: #1a1a2e;
    font-size: 16px;
    font-weight: bold;
    border: none;
    border-radius: 26px;
    cursor: pointer;
    touch-action: manipulation;
    box-shadow: 0 4px 0 #9a4800, 0 6px 12px rgba(224,112,32,0.35);
    transition: transform 0.08s, box-shadow 0.08s, opacity 0.08s;
    will-change: transform;
  }
  .btn-primary:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 #9a4800, 0 2px 6px rgba(224,112,32,0.25);
    opacity: 0.92;
  }

  /* Timer bar */
  .timer-bar-wrap {
    height: 4px;
    background: #0f3460;
    border-radius: 2px;
    flex-shrink: 0;
    overflow: hidden;
  }
  .timer-bar {
    height: 100%;
    background: #e94560;
    border-radius: 2px;
    transition: width 0.9s linear;
  }

  /* ===== SKILL ===== */
  .skill-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .btn-skill {
    height: 40px;
    padding: 0 16px;
    border-radius: 20px;
    border: 2px solid #a78bfa;
    background: #1a1230;
    color: #a78bfa;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    transition: opacity 0.1s, transform 0.1s, background 0.15s;
  }
  .btn-skill:active:not(:disabled) { transform: scale(0.96); }
  .btn-skill.active {
    background: #a78bfa;
    color: #1a1230;
  }
  .btn-skill:disabled {
    opacity: 0.3;
    cursor: default;
    border-color: #555;
    color: #555;
    background: transparent;
  }

  /* ミュートボタン */
  .btn-mute {
    height: 36px;
    width: 36px;
    border-radius: 50%;
    border: 1px solid #2a3a5a;
    background: #16213e;
    color: #668;
    font-size: 16px;
    cursor: pointer;
    touch-action: manipulation;
    transition: opacity 0.1s, transform 0.08s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .btn-mute:active { transform: scale(0.9); opacity: 0.8; }
  .btn-mute.muted  { color: #e94560; border-color: #e94560; }

  /* Combo multiplier badge on COMBO stat */
  #combo-mult {
    font-size: 11px;
    font-weight: bold;
    color: #c4b0ff;
    display: block;
    line-height: 1;
    min-height: 13px;
    letter-spacing: 0.5px;
  }

  /* ===== DIFFICULTY SELECTOR ===== */
  .diff-selector {
    display: flex;
    gap: 8px;
    width: 100%;
    max-width: 300px;
  }
  .btn-diff {
    flex: 1;
    height: 44px;
    border-radius: 10px;
    border: 2px solid #2a3a5a;
    background: #16213e;
    color: #778;
    font-size: 13px;
    font-weight: bold;
    cursor: pointer;
    touch-action: manipulation;
    transition: transform 0.08s, opacity 0.08s, border-color 0.15s, color 0.15s, background 0.15s;
    letter-spacing: 0.5px;
  }
  .btn-diff:active { transform: scale(0.95); opacity: 0.85; }
  .btn-diff.selected-easy   { border-color: #4ecca3; color: #4ecca3; background: #162e22; }
  .btn-diff.selected-normal { border-color: #f0c040; color: #f0c040; background: #2a2010; }
  .btn-diff.selected-hard   { border-color: #e94560; color: #e94560; background: #2e1018; }

  /* ===== SCORE FLOAT (+N) ===== */
  #score-float {
    position: absolute;
    top: 12px; right: 16px;
    font-size: 22px;
    font-weight: bold;
    color: #f0c040;
    pointer-events: none;
    opacity: 0;
    transform: translateY(0);
  }
  @keyframes score-float-anim {
    0%   { opacity: 1; transform: translateY(0)   scale(1); }
    30%  { opacity: 1; transform: translateY(-10px) scale(1.2); }
    100% { opacity: 0; transform: translateY(-32px) scale(0.9); }
  }
  #score-float.pop {
    animation: score-float-anim 0.7s ease-out forwards;
  }

  /* ===== COMBO STAGES ===== */
  /* 3連: 金パルス */
  .stat-box.combo-s1 { border-color: rgba(240,192,64,0.8) !important; }
  @keyframes combo-pulse-s1 {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  .stat-box.combo-s1 { animation: combo-pulse-s1 0.6s ease-in-out infinite; }

  /* 5連: オレンジ */
  .stat-box.combo-s2 { border-color: rgba(255,140,0,0.9) !important; }
  @keyframes combo-pulse-s2 {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.08); }
  }
  .stat-box.combo-s2 { animation: combo-pulse-s2 0.45s ease-in-out infinite; }
  .stat-box.combo-s2 .stat-value.combo { color: #ff8c00 !important; }

  /* 8連: 赤・高速振動 */
  .stat-box.combo-s3 { border-color: rgba(255,60,60,1) !important; }
  @keyframes combo-pulse-s3 {
    0%,100% { transform: scale(1); }
    25%      { transform: scale(1.12) rotate(-1deg); }
    75%      { transform: scale(1.12) rotate(1deg); }
  }
  .stat-box.combo-s3 { animation: combo-pulse-s3 0.3s ease-in-out infinite; }
  .stat-box.combo-s3 .stat-value.combo { color: #ff4444 !important; font-size: 30px !important; }

  /* コンボ喪失アニメ */
  @keyframes combo-break-anim {
    0%   { transform: scale(1.2); opacity: 1; }
    60%  { transform: scale(0.85); opacity: 0.6; }
    100% { transform: scale(1);   opacity: 1; }
  }
  .combo-break { animation: combo-break-anim 0.35s ease-out; }

  /* ===== TIME DANGER ===== */
  @keyframes time-blink {
    0%,100% { opacity: 1; }
    50%      { opacity: 0.4; }
  }
  .stat-value.time.time-danger {
    color: #ff2244 !important;
    animation: time-blink 0.6s ease-in-out infinite;
  }
  /* タイマーバーも赤く */
  .timer-bar.danger { background: #ff2244; }

  /* ===== GAMEOVER ENHANCEMENTS ===== */
  /* ベスト更新時の金輝き */
  @keyframes best-shine {
    0%   { opacity: 0; transform: scale(0.8); }
    50%  { opacity: 1; transform: scale(1.05); }
    100% { opacity: 1; transform: scale(1); }
  }
  .best-new {
    animation: best-shine 0.5s ease-out forwards;
    color: #f0c040 !important;
    text-shadow: 0 0 12px rgba(240,192,64,0.8);
  }
  /* リスタートボタン強調点滅 */
  @keyframes restart-pulse {
    0%,100% { box-shadow: 0 4px 0 #9a4800, 0 6px 12px rgba(224,112,32,0.35); transform: scale(1); }
    50%      { box-shadow: 0 4px 0 #9a4800, 0 6px 24px rgba(224,112,32,0.7); transform: scale(1.03); }
  }
  #btn-restart.pulse { animation: restart-pulse 0.8s ease-in-out infinite; }

  /* 前回比表示 */
  #res-diff {
    font-size: 13px;
    text-align: center;
    font-weight: bold;
    min-height: 18px;
  }
  #res-diff.positive { color: #4ecca3; }
  #res-diff.negative { color: #e94560; }

  /* ===== NEXT RANK ===== */
  #next-rank {
    font-size: 11px;
    color: #778899;
    text-align: right;
    flex-shrink: 0;
    min-height: 14px;
    padding-right: 2px;
  }
  #next-rank.close { color: #f0c040; font-weight: bold; }

  /* ===== BONUS TAG ===== */
  .tag-bonus { background: #2a1a40; color: #d8a0ff; border: 1px solid #d8a0ff; }
</style>
</head>
<body>
<div id="app">

  <!-- TITLE -->
  <div id="screen-title" class="screen active">
    <div class="title-logo">📞 テレアポ道場<span>～架電の達人を目指せ～</span></div>
    <div class="title-desc">
      次々と来る案件に対応し<br>
      信頼度を保ちながらスコアを稼ごう！<br><br>
      時間切れ・信頼度0でゲームオーバー
    </div>
    <div id="title-best" style="font-size:15px;color:#f0c040;font-weight:bold;"></div>
    <div class="diff-selector">
      <button class="btn-diff" id="btn-diff-easy">EASY</button>
      <button class="btn-diff" id="btn-diff-normal">NORMAL</button>
      <button class="btn-diff" id="btn-diff-hard">HARD</button>
    </div>
    <button class="btn-primary" id="btn-start">スタート</button>
    <div id="version-display" style="font-size:11px;color:#444;position:absolute;bottom:max(env(safe-area-inset-bottom,8px),8px);right:12px;"></div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="status-bar">
      <div class="stat-box">
        <div class="stat-label">SCORE</div>
        <div class="stat-value score" id="val-score">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">信頼度</div>
        <div class="stat-value trust" id="val-trust">10</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">TIME</div>
        <div class="stat-value time" id="val-time">60</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">COMBO</div>
        <div class="stat-value combo" id="val-combo">0</div>
        <span id="combo-mult"></span>
      </div>
    </div>

    <div class="timer-bar-wrap">
      <div class="timer-bar" id="timer-bar"></div>
    </div>

    <!-- スキルバー -->
    <div class="skill-bar">
      <button class="btn-mute" id="btn-mute" aria-label="ミュート切替">🔊</button>
      <button class="btn-skill" id="btn-skill">⚡ 集中モード</button>
    </div>

    <div class="case-card" id="case-card">
      <span class="case-tag" id="case-tag"></span>
      <div class="case-company" id="case-company"></div>
      <div class="case-situation" id="case-situation"></div>
      <div class="case-hint" id="case-hint"></div>
      <div class="feedback" id="feedback"></div>
    </div>

    <div class="choices" id="choices">
      <button class="choice-btn" id="btn-c0"></button>
      <button class="choice-btn" id="btn-c1"></button>
      <button class="choice-btn" id="btn-c2"></button>
    </div>
    <!-- 加点フロート表示（case-cardの外、choicesの上に絶対配置） -->
    <div id="score-float"></div>
    <!-- 次ランクまでの距離 -->
    <div id="next-rank"></div>
  </div>

  <!-- GAMEOVER -->
  <div id="screen-gameover" class="screen">
    <!-- ① 即リトライ（最上部・最大） -->
    <button class="btn-primary" id="btn-restart" style="margin-top:4px;">🔄 もう一度！</button>
    <!-- ② 結果サマリ -->
    <div class="over-title">🚫 ゲームオーバー</div>
    <div class="over-rank" id="over-rank"></div>
    <div id="over-reason"></div>
    <!-- ③ 誘導メッセージ -->
    <div id="over-nudge"></div>
    <!-- ④ スコア詳細（コンパクト） -->
    <div class="over-stats">
      <div class="over-stat-row"><span>スコア</span><span id="res-score"></span></div>
      <div class="over-stat-row"><span id="res-diff-label">前回比</span><span id="res-diff"></span></div>
      <div class="over-stat-row"><span>最大コンボ</span><span id="res-combo"></span></div>
      <div class="over-stat-row" style="border-top:1px solid #0f3460;padding-top:7px;"><span>🏅 ベスト</span><span id="res-best"></span></div>
    </div>
    <!-- ⑤ ラスト1回フック -->
    <div id="over-hook"></div>
  </div>

</div>

<script>
(function() {
'use strict';

const VERSION = 'v1.8.0';

// プレイ回数カウンター（セッション内）
let playCount = 0;

/* ===================================================
   DIFFICULTY CONFIG
=================================================== */
const DIFFICULTY_CONFIG = {
  easy:   { time: 80, trustLossBase: 1, trustLossLate: 2, scoreMult: 0.8,  label: 'EASY'   },
  normal: { time: 60, trustLossBase: 2, trustLossLate: 3, scoreMult: 1.0,  label: 'NORMAL' },
  hard:   { time: 50, trustLossBase: 3, trustLossLate: 4, scoreMult: 1.5,  label: 'HARD'   },
};

// タイトル画面で選択中の難易度（startGame前に確定）
let selectedDifficulty = 'normal';

/* ===================================================
   SOUND ENGINE (Web Audio API)
=================================================== */
const SE = (() => {
  let ctx = null;         // AudioContext（遅延初期化）
  let muted = false;

  /* ユーザー操作後に一度だけ初期化 */
  function init() {
    if (ctx) return;
    try {
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) {
      ctx = null;
    }
  }

  /* 共通：オシレータ＋ゲイン再生ユーティリティ
     params: { freq, type, vol, attack, decay, freqEnd } */
  function play(params) {
    if (muted || !ctx) return;
    try {
      const t   = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain= ctx.createGain();

      osc.type = params.type || 'sine';
      osc.frequency.setValueAtTime(params.freq, t);
      if (params.freqEnd !== undefined) {
        osc.frequency.exponentialRampToValueAtTime(params.freqEnd, t + params.decay);
      }

      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(params.vol, t + (params.attack || 0.005));
      gain.gain.exponentialRampToValueAtTime(0.001, t + params.decay);

      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + params.decay + 0.01);
    } catch (e) { /* 再生失敗は無視 */ }
  }

  return {
    init,
    get muted() { return muted; },
    setMuted(v) { muted = !!v; },

    /* 成功音：ピコン（880Hz→1320Hz、短め） */
    success() {
      play({ freq: 880, freqEnd: 1320, type: 'sine', vol: 0.15, attack: 0.005, decay: 0.18 });
    },

    /* 失敗音：低め落下（300Hz→180Hz） */
    fail() {
      play({ freq: 300, freqEnd: 180, type: 'triangle', vol: 0.15, attack: 0.005, decay: 0.22 });
    },

    /* クリック音：極短パルス */
    click() {
      play({ freq: 440, type: 'square', vol: 0.07, attack: 0.002, decay: 0.04 });
    },

    /* スキル発動音：ちょっと特別感（コード風・2音） */
    skill() {
      play({ freq: 660, freqEnd: 990, type: 'sine', vol: 0.12, attack: 0.01, decay: 0.25 });
      setTimeout(() => {
        play({ freq: 880, freqEnd: 1100, type: 'sine', vol: 0.10, attack: 0.01, decay: 0.2 });
      }, 60);
    },

    /* ゲーム開始音：上昇チャイム */
    start() {
      [523, 659, 784].forEach((f, i) => {
        setTimeout(() => play({ freq: f, type: 'sine', vol: 0.12, attack: 0.01, decay: 0.15 }), i * 70);
      });
    },
  };
})();

/* ===================================================
   BEST SCORE
=================================================== */
const BEST_KEY = 'teleapo_best_score';

function loadBestScore() {
  try {
    const v = parseInt(localStorage.getItem(BEST_KEY), 10);
    return (Number.isFinite(v) && v >= 0) ? v : 0;
  } catch (e) {
    return 0;
  }
}

function saveBestScore(score) {
  try {
    localStorage.setItem(BEST_KEY, String(score));
  } catch (e) {
    // localStorage 使用不可の場合は無視
  }
}

function updateBestScore(score) {
  const current = loadBestScore();
  if (score > current) {
    saveBestScore(score);
    return true; // 更新あり
  }
  return false;
}

/* ===================================================
   RANK THRESHOLDS（次ランク目標）
=================================================== */
const RANK_THRESHOLDS = [60, 120, 200, 300]; // 昇順

function getNextRankInfo(score) {
  for (const t of RANK_THRESHOLDS) {
    if (score < t) return t - score; // 残り点数
  }
  return null; // 最高ランク到達済み
}

function getRank(score) {
  if (score >= 300) return '🏆 伝説の架電師';
  if (score >= 200) return '🥇 エース営業';
  if (score >= 120) return '🥈 一人前の営業';
  if (score >= 60)  return '🥉 見習い営業';
  return '📋 研修中';
}

/* ===================================================
   UI UPDATE
=================================================== */
function updateStatusUI() {
  elScore.textContent = state.score;
  elTrust.textContent = Math.max(0, state.trust);
  elTime.textContent  = Math.max(0, state.time);
  elCombo.textContent = state.combo;
  const maxTime = DIFFICULTY_CONFIG[state.difficulty].time;
  const pct = (state.time / maxTime) * 100;
  elTimerBar.style.width = pct + '%';

  // コンボ倍率バッジ更新
  const mult = getComboMultiplier(state.combo);
  elComboMult.textContent = mult > 1 ? '×' + mult : '';

  // 次ランク表示更新
  const remaining = getNextRankInfo(state.score);
  if (remaining === null) {
    elNextRank.textContent = '🏆 最高ランク達成！';
    elNextRank.className = 'close';
  } else {
    elNextRank.textContent = '次ランクまで あと ' + remaining + 'pt';
    elNextRank.className = remaining <= 20 ? 'close' : '';
  }

  // コンボ段階エフェクト（3/5/8）
  elComboBox.classList.remove('combo-s1', 'combo-s2', 'combo-s3');
  if      (state.combo >= 8) elComboBox.classList.add('combo-s3');
  else if (state.combo >= 5) elComboBox.classList.add('combo-s2');
  else if (state.combo >= 3) elComboBox.classList.add('combo-s1');

  // TIME 残り10秒以下: 危険演出
  const elTimeVal = document.getElementById('val-time');
  if (state.time <= 10 && state.time > 0) {
    elTimeVal.classList.add('time-danger');
    elTimerBar.classList.add('danger');
  } else {
    elTimeVal.classList.remove('time-danger');
    elTimerBar.classList.remove('danger');
  }
}

function renderCase(c) {

  if (state.isBonus) {

    elTag.className   = 'case-tag tag-bonus';

  }
  elCompany.textContent = c.company;
  elSit.textContent     = c.situation;
  elHint.textContent = state.isBonus
    ? '💡 ' + c.hint.slice(0, 14) + '… ×2ボーナス！'
    : '💡 ' + c.hint.slice(0, 18) + (c.hint.length > 18 ? '…' : '');

  // shuffle choices
  const shuffled = shuffleArray([...c.choices]);
  elChoices.forEach((btn, i) => {
    btn.textContent = shuffled[i].text;
    btn.dataset.correct = shuffled[i].correct ? '1' : '0';
    btn.className = 'choice-btn';
    btn.disabled = false;
  });

  elFeedback.className = 'feedback';
  elFeedback.textContent = '';
}

/* ===================================================
   CASE SELECTION
=================================================== */
function pickCase() {
  let idx;
  let tries = 0;
  do {
    idx = Math.floor(Math.random() * CASES.length);
    tries++;
  } while (idx === state.prevCaseIndex && tries < 10);
  state.prevCaseIndex = state.caseIndex;
  state.caseIndex = idx;
  // ボーナス案件：15%の確率（連続ボーナスは防ぐ）
  state.isBonus = !state.isBonus && Math.random() < 0.15;
  return CASES[idx];
}

function shuffleArray(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

/* ===================================================
   TIMER
=================================================== */
function startTimer() {
  stopTimer();
  timerId = setInterval(() => {
    if (state.phase !== 'playing') return;
    state.time -= 1;
    updateStatusUI();
    if (state.time <= 0) {
      state.time = 0;
      state.gameOverReason = 'time';
      updateStatusUI();
      triggerGameOver();
    }
  }, 1000);
}

function stopTimer() {
  if (timerId !== null) {
    clearInterval(timerId);
    timerId = null;
  }
}

/* ===================================================
   GAME OVER
=================================================== */
function triggerGameOver() {
  if (state.phase === 'over') return;
  state.phase = 'over';
  stopTimer();
  playCount++;

  const isNew  = updateBestScore(state.score);
  const best   = loadBestScore();
  const cfg    = DIFFICULTY_CONFIG[state.difficulty];
  const scoreDiff = state.score - state.prevScore;

  // スコア・コンボ
  elResScore.textContent = state.score + ' pt';
  elResCombo.textContent = state.maxCombo + ' 連続';
  elRank.textContent     = getRank(state.score);

  // ベスト
  elResBest.textContent = best + ' pt' + (isNew ? ' 🎉NEW!' : '');
  isNew ? elResBest.classList.add('best-new') : elResBest.classList.remove('best-new');

  // 前回比
  if (state.prevScore > 0) {
    elResDiff.textContent = (scoreDiff >= 0 ? '▲ +' : '▼ ') + scoreDiff + 'pt';
    elResDiff.className   = scoreDiff >= 0 ? 'positive' : 'negative';
  } else {
    elResDiff.textContent = '初プレイ';
    elResDiff.className   = '';
  }

  // ミス理由バッジ
  elOverReason.textContent = state.gameOverReason === 'trust'
    ? '💔 信頼度がなくなりました'
    : '⏰ タイムアップ';

  // 難易度ラベル
  document.querySelector('#screen-gameover .over-title').textContent =
    '🚫 GAME OVER ［' + cfg.label + '］';

  // ---- 誘導メッセージ（あと○点） ----
  const toNext = getNextRankInfo(state.score);
  const toBest = best - state.score;
  if (isNew) {
    elOverNudge.textContent = '🏆 ベスト更新！次はさらに上を目指せ！';
  } else if (toBest > 0 && toBest <= 30) {
    elOverNudge.textContent = '🔥 ベストまであと ' + toBest + 'pt！';
  } else if (toNext !== null && toNext <= 25) {
    elOverNudge.textContent = '⬆️ ランクアップまであと ' + toNext + 'pt！';
  } else if (toNext !== null) {
    elOverNudge.textContent = '次ランクまで ' + toNext + 'pt';
  } else {
    elOverNudge.textContent = '';
  }

  // ---- ラスト1回フック ----
  const hooks = [
    'あと1回だけ！',
    '今日のベストを更新しよう',
    'もう少しで上達できる！',
    '次こそコンボを伸ばせ！',
  ];
  elOverHook.textContent = playCount >= 2 ? hooks[(playCount - 2) % hooks.length] : '';

  // リスタートボタン点滅
  const btnRestart = document.getElementById('btn-restart');
  btnRestart.classList.remove('pulse');
  void btnRestart.offsetWidth;
  btnRestart.classList.add('pulse');

  showScreen('gameover');
}

/* ===================================================
   CHOICE HANDLER
=================================================== */
function onChoiceClick(btn) {
  if (state.phase !== 'playing') return;
  if (state.locked) return;
  state.locked = true;

  SE.click(); // ボタン押下音

  // disable all buttons
  elChoices.forEach(b => { b.disabled = true; });

  // 集中モード発動中は強制成功
  const isCorrect = state.focusMode ? true : btn.dataset.correct === '1';

  // 集中モード消費（発動中だった場合）
  const wasFocusMode = state.focusMode;
  if (state.focusMode) {
    state.focusMode = false;
    state.focusUsed = true;
    // 全ボタンを正解色に（どれを押しても成功扱い）
    elChoices.forEach(b => { b.classList.add('correct'); });
    updateSkillUI();
  }

  if (isCorrect) {
    // コンボ倍率 × 難易度スコア倍率 × ボーナス倍率
    const cfg      = DIFFICULTY_CONFIG[state.difficulty];
    const comboMul = getComboMultiplier(state.combo);
    const bonusMul = state.isBonus ? 2 : 1;
    const gained   = Math.round(10 * comboMul * cfg.scoreMult * bonusMul);
    state.score += gained;
    state.trust  = Math.min(10, state.trust + 1);
    state.combo += 1;
    if (state.combo > state.maxCombo) state.maxCombo = state.combo;
    if (!wasFocusMode) btn.classList.add('correct');
    showFeedback(true, gained, state.isBonus);
    showScoreFloat(gained, state.isBonus);
    SE.success();
    popStat(elScore);
    popStat(elCombo);
  } else {
    // 難易度別 trust 減少量（後半はさらに+1）
    const cfg = DIFFICULTY_CONFIG[state.difficulty];
    const halfTime = cfg.time / 2;
    const trustLoss = state.time <= halfTime ? cfg.trustLossLate : cfg.trustLossBase;
    state.score  = Math.max(0, state.score - 5);
    state.trust -= trustLoss;
    // コンボ喪失演出（コンボがあった場合のみ）
    if (state.combo >= 3) {
      elComboBox.classList.remove('combo-break');
      void elComboBox.offsetWidth;
      elComboBox.classList.add('combo-break');
    }
    state.combo  = 0;
    btn.classList.add('wrong');
    elChoices.forEach(b => { if (b.dataset.correct === '1') b.classList.add('correct'); });
    showFeedback(false, 0, false);
    SE.fail();
  }

  updateStatusUI();

  // check game over by trust
  if (state.trust <= 0) {
    state.gameOverReason = 'trust';
    setTimeout(() => { triggerGameOver(); }, 500);
    return;
  }

  // テンポ：成功350ms / 失敗500ms
  const nextDelay = isCorrect ? 350 : 500;
  setTimeout(() => {
    if (state.phase !== 'playing') return;
    state.locked = false;
    renderCase(pickCase());
  }, nextDelay);
}

function showFeedback(success, gained, isBonus) {
  let text;
  if (success) {
    if (isBonus)        text = '💜 BONUS！ +' + gained + 'pt';
    else if (gained > 10) text = '✅ 成功！ +' + gained + 'pt';
    else                  text = '✅ 成功！';
  } else {
    text = '❌ 失敗…';
  }
  elFeedback.textContent = text;
  elFeedback.className   = 'feedback show ' + (success ? 'success' : 'fail');
}

/* ===================================================
   START / RESTART
=================================================== */
function startGame() {
  stopTimer();

  // 引き継ぎ値
  const prevMuted = state.muted;
  const prevScore = state.phase === 'over' ? state.score : state.prevScore;
  const diff = selectedDifficulty;
  const cfg  = DIFFICULTY_CONFIG[diff];

  state = {
    score: 0,
    trust: 10,
    time: cfg.time,
    combo: 0,
    maxCombo: 0,
    phase: 'playing',
    locked: false,
    caseIndex: -1,
    prevCaseIndex: -1,
    focusMode: false,
    focusUsed: false,
    muted: prevMuted,
    difficulty: diff,
    isBonus: false,
    prevScore,
    gameOverReason: '',
  };

  // リスタートボタンの点滅を止める
  document.getElementById('btn-restart').classList.remove('pulse');

  SE.init();          // AudioContext 初期化（初回のみ有効）
  SE.setMuted(state.muted);
  SE.start();         // ゲーム開始チャイム

  updateStatusUI();
  updateSkillUI();
  updateMuteUI();
  elTimerBar.style.transition = 'none';
  elTimerBar.style.width = '100%';
  // re-enable transition after forced reflow
  elTimerBar.getBoundingClientRect();
  elTimerBar.style.transition = 'width 0.9s linear';

  renderCase(pickCase());
  showScreen('game');
  startTimer();
}

/* ===================================================
   EVENT LISTENERS
=================================================== */
document.getElementById('version-display').textContent = VERSION;

// 難易度ボタン初期表示
updateDifficultyUI();

// 難易度選択イベント
['easy', 'normal', 'hard'].forEach(d => {
  document.getElementById('btn-diff-' + d).addEventListener('pointerup', (e) => {
    e.preventDefault();
    SE.init();
    SE.click();
    selectedDifficulty = d;
    updateDifficultyUI();
  });
});

// タイトル画面のベストスコア初期表示
function renderTitleBest() {
  const best = loadBestScore();
  elTitleBest.textContent = best > 0 ? '🏅 ベストスコア：' + best + ' pt' : '';
}
renderTitleBest();

document.getElementById('btn-start').addEventListener('pointerup', (e) => {
  e.preventDefault();
  SE.init();
  SE.click();
  startGame();
});

document.getElementById('btn-restart').addEventListener('pointerup', (e) => {
  e.preventDefault();
  SE.click();
  startGame();
});

elChoices.forEach(btn => {
  btn.addEventListener('pointerup', (e) => {
    e.preventDefault();
    onChoiceClick(btn);
  });
});

// スキルボタン：集中モード
elBtnSkill.addEventListener('pointerup', (e) => {
  e.preventDefault();
  if (state.phase !== 'playing') return;
  if (state.focusUsed || state.focusMode || state.locked) return;
  state.focusMode = true;
  SE.skill();
  updateSkillUI();
});

// ミュートボタン
elBtnMute.addEventListener('pointerup', (e) => {
  e.preventDefault();
  SE.init(); // 未初期化の場合に備えて
  state.muted = !state.muted;
  SE.setMuted(state.muted);
  updateMuteUI();
  if (!state.muted) SE.click(); // ミュート解除時のみ音を鳴らす
});

})();
</script>
